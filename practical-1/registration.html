<body>
    <h2 style="text-align: center;">Registration</h2><hr>

    <section style="margin-left: 40%; margin-right: 10%;">
        <lable id="fname" >Name : </lable>
        <input type="text" id="fname" name="fname" ><br><br>

        <lable id="mail" >Mail : </lable>
        <input type="text" id="mail" name="mail" ><br><br>

        <lable id="role" >Role : </lable>
        <select id="role">
            <option value="selectrole">-Select Role-</option>
            <option value="Student">Student</option>
            <option value="Faculty">Faculty</option>
        </select><br><br>

        <lable id="date" >Date of Birth : </lable>
        <input type="date" id="date" name="date"><br><br>

        <lable id="radio" >Gender : </lable>
        <input type="radio" id="male" name="male" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="female" value="female">
        <label for="female">Female</label><br><br>

        <label for="address">Address : </label><br>
        <textarea id="address" name="address" rows="5" cols="40" placeholder="Enter address"></textarea>
    </section><br>
     <div style="text-align: center;">
            <button type="button" onclick="window.location.href='dashboard.html';">Register</button>
    </div>
    

</body>
